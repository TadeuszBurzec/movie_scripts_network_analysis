<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULP FICTION — Analiza Sieci Postaci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0a0a;
  --bg2:       #111111;
  --bg3:       #181818;
  --border:    #2a2a2a;
  --blood:     #c0392b;
  --blood2:    #e74c3c;
  --gold:      #f39c12;
  --gold2:     #f1c40f;
  --cream:     #f5e6c8;
  --smoke:     #8a8a8a;
  --white:     #f0f0f0;
  --comm0:     #c0392b;  /* Jules/Vincent — crimson */
  --comm1:     #2980b9;  /* Mia/Marsellus — cobalt */
  --comm2:     #27ae60;  /* Butch — forest */
  --comm3:     #f39c12;  /* Diner — amber */
  --font-display: 'Bebas Neue', sans-serif;
  --font-body:    'Courier Prime', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-body);
  font-size: 13px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* GRAIN OVERLAY */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:9999; opacity:.35;
}

/* SCANLINE */
body::after {
  content:'';
  position:fixed; inset:0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 4px);
  pointer-events:none; z-index:9998;
}

/* ─── HEADER ─── */
header {
  background: linear-gradient(180deg, #0a0a0a 0%, #111 100%);
  border-bottom: 2px solid var(--blood);
  padding: 18px 28px 14px;
  display: flex;
  align-items: baseline;
  gap: 20px;
  position: relative;
}
header::after {
  content:'';
  position:absolute; bottom:-4px; left:0; right:0;
  height:2px; background: var(--gold);
  opacity:.3;
}
h1 {
  font-family: var(--font-display);
  font-size: 52px;
  letter-spacing: 6px;
  color: var(--cream);
  text-shadow: 0 0 40px rgba(192,57,43,.4), 2px 2px 0 rgba(0,0,0,.8);
  line-height:1;
}
header .subtitle {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 4px;
  color: var(--gold);
  opacity:.8;
  margin-bottom: 4px;
}
header .meta {
  font-size:11px;
  color: var(--smoke);
  letter-spacing:2px;
  text-transform:uppercase;
}
.blood-bar {
  position:absolute; left:0; top:0; bottom:0;
  width:5px;
  background: linear-gradient(180deg, var(--blood) 0%, var(--blood2) 100%);
}

/* ─── LAYOUT ─── */
.main-layout {
  display: grid;
  grid-template-columns: 1fr 320px;
  grid-template-rows: auto;
  height: calc(100vh - 105px);
  min-height: 500px;
}

/* ─── GRAPH PANEL ─── */
.graph-panel {
  position: relative;
  overflow: hidden;
  background: radial-gradient(ellipse at 40% 40%, #141414 0%, #0a0a0a 70%);
  border-right: 1px solid var(--border);
}

.mode-controls {
  position: absolute;
  top: 16px; left: 16px;
  display: flex; gap: 6px;
  z-index: 10;
  flex-wrap: wrap;
  max-width: 80%;
}
.mode-btn {
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 2px;
  padding: 6px 14px;
  background: rgba(0,0,0,.8);
  border: 1px solid var(--border);
  color: var(--smoke);
  cursor: pointer;
  transition: all .2s;
}
.mode-btn:hover { border-color: var(--gold); color: var(--gold); }
.mode-btn.active { background: var(--blood); border-color: var(--blood2); color: var(--cream); }

#graph-svg { width:100%; height:100%; display:block; }

/* ─── RIGHT PANEL ─── */
.right-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg2);
}

/* NODE CARD */
.node-card {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg3);
  min-height: 180px;
  flex-shrink: 0;
}
.node-card .placeholder {
  color: var(--smoke);
  font-style: italic;
  font-size:12px;
  margin-top:8px;
}
.node-name {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: 3px;
  color: var(--cream);
  line-height:1;
  margin-bottom:8px;
}
.comm-tag {
  display:inline-block;
  padding: 2px 10px;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:10px;
  border-radius:2px;
}
.metric-row {
  display:flex; align-items:center; gap:8px;
  margin-bottom:5px;
}
.metric-label { color:var(--smoke); font-size:10px; letter-spacing:1px; width:80px; flex-shrink:0; text-transform:uppercase; }
.metric-bar-wrap { flex:1; background:rgba(255,255,255,.07); height:4px; border-radius:2px; }
.metric-bar { height:4px; border-radius:2px; transition:width .4s; }
.metric-val { color:var(--gold); font-size:10px; width:40px; text-align:right; }

.links-title { color:var(--smoke); font-size:10px; letter-spacing:2px; text-transform:uppercase; margin: 8px 0 4px; }
.link-row { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.link-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.link-name { flex:1; font-size:11px; color:var(--cream); }
.link-weight { font-size:11px; color:var(--smoke); }

/* LEGEND */
.legend-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink:0;
}
.section-title {
  font-family: var(--font-display);
  font-size:14px;
  letter-spacing:3px;
  color: var(--blood);
  margin-bottom:8px;
}
.comm-item {
  display:flex; align-items:center; gap:8px;
  margin-bottom:6px;
  cursor:pointer;
  padding:3px 6px;
  border-radius:2px;
  transition:background .15s;
}
.comm-item:hover { background:rgba(255,255,255,.05); }
.comm-item.active-filter { background:rgba(192,57,43,.15); border-left:2px solid var(--blood); padding-left:4px; }
.comm-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.comm-label { font-size:11px; color:var(--cream); flex:1; }
.comm-count { font-size:10px; color:var(--smoke); }

/* RANKING */
.ranking-section {
  flex:1;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.rank-tabs {
  display:flex;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.rank-tab {
  flex:1;
  font-family:var(--font-display);
  font-size:12px;
  letter-spacing:1.5px;
  padding:8px 4px;
  text-align:center;
  color:var(--smoke);
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .15s;
  background:none;
  border-top:none;
  border-left:none;
  border-right:none;
}
.rank-tab.active { color:var(--gold); border-bottom-color:var(--gold); }
.rank-tab:hover:not(.active) { color:var(--cream); }
.rank-list {
  overflow-y:auto;
  flex:1;
  scrollbar-width:thin;
  scrollbar-color: var(--blood) var(--bg);
}
.rank-list::-webkit-scrollbar { width:4px; }
.rank-list::-webkit-scrollbar-track { background:var(--bg); }
.rank-list::-webkit-scrollbar-thumb { background:var(--blood); }
.rank-row {
  display:flex; align-items:center; gap:7px;
  padding:6px 12px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.03);
  transition:background .12s;
}
.rank-row:hover { background:rgba(255,255,255,.04); }
.rank-num { color:var(--blood); font-size:10px; width:16px; flex-shrink:0; }
.rank-name { flex:1; font-size:11px; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-bar-wrap { width:55px; background:rgba(255,255,255,.07); height:3px; border-radius:2px; }
.rank-bar { height:3px; border-radius:2px; }
.rank-val { color:var(--smoke); font-size:10px; width:36px; text-align:right; flex-shrink:0; }

/* ─── INTERPRETATION ─── */
.interpretation {
  padding: 40px 48px;
  background: var(--bg2);
  border-top: 2px solid var(--blood);
}
.interp-title {
  font-family:var(--font-display);
  font-size:36px;
  letter-spacing:5px;
  color:var(--cream);
  margin-bottom:6px;
}
.interp-subtitle {
  font-family:var(--font-display);
  font-size:16px;
  letter-spacing:3px;
  color:var(--gold);
  margin-bottom:28px;
  opacity:.8;
}
.interp-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:32px;
  margin-bottom:32px;
}
.interp-block h3 {
  font-family:var(--font-display);
  font-size:16px;
  letter-spacing:3px;
  color:var(--blood2);
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
  padding-bottom:6px;
}
.interp-block p, .interp-block li {
  color:var(--smoke);
  line-height:1.8;
  font-size:13px;
  margin-bottom:6px;
}
.interp-block em { color:var(--gold); font-style:normal; }
.interp-block ul { padding-left:16px; }
.interp-block li::marker { color:var(--blood); }
.stat-pill {
  display:inline-block;
  background:rgba(192,57,43,.15);
  border:1px solid var(--blood);
  color:var(--gold);
  font-size:11px;
  letter-spacing:1px;
  padding:2px 8px;
  border-radius:2px;
  margin:2px 2px;
}
.full-width { grid-column:1/-1; }

/* TOOLTIP */
#tooltip {
  position:fixed;
  background:rgba(10,10,10,.95);
  border:1px solid var(--blood);
  border-left:3px solid var(--gold);
  padding:10px 14px;
  font-family:var(--font-body);
  font-size:11px;
  color:var(--cream);
  pointer-events:none;
  z-index:1000;
  display:none;
  max-width:200px;
}
#tooltip .t-name { font-family:var(--font-display); font-size:18px; letter-spacing:2px; color:var(--cream); margin-bottom:4px; }
#tooltip .t-row { color:var(--smoke); margin-bottom:2px; }
#tooltip .t-row span { color:var(--gold); }
</style>
</head>

<div id="tooltip"></div>

// ═══════════════════════════════════════════════════════════
// SNA COMPUTATIONS
// ═══════════════════════════════════════════════════════════
const nodeIds = RAW_NODES.map(n=>n.id);
const N = nodeIds.length;
const idx = {}; nodeIds.forEach((id,i)=>idx[id]=i);

// Adjacency (weighted + unweighted)
const adjW = Array.from({length:N},()=>new Array(N).fill(0));
const adjU = Array.from({length:N},()=>new Array(N).fill(0));
const adjList = Array.from({length:N},()=>[]);

RAW_EDGES.forEach(e=>{
  const a=idx[e.s], b=idx[e.t];
  if(a===undefined||b===undefined) return;
  adjW[a][b]+=e.w; adjW[b][a]+=e.w;
  adjU[a][b]=1; adjU[b][a]=1;
  adjList[a].push({j:b,w:e.w});
  adjList[b].push({j:a,w:e.w});
});

// 1. Weighted Degree
const wDeg = nodeIds.map((_,i)=>adjList[i].reduce((s,{w})=>s+w,0));
const maxWDeg = Math.max(...wDeg);

// 2. Betweenness (Brandes, unweighted BFS)
function computeBetweenness(){
  const cb = new Array(N).fill(0);
  for(let s=0;s<N;s++){
    const stack=[], pred=Array.from({length:N},()=>[]);
    const sigma=new Array(N).fill(0); sigma[s]=1;
    const dist=new Array(N).fill(-1); dist[s]=0;
    const queue=[s];
    while(queue.length){
      const v=queue.shift(); stack.push(v);
      for(const {j:w} of adjList[v]){
        if(dist[w]<0){dist[w]=dist[v]+1;queue.push(w);}
        if(dist[w]===dist[v]+1){sigma[w]+=sigma[v];pred[w].push(v);}
      }
    }
    const delta=new Array(N).fill(0);
    while(stack.length){
      const w=stack.pop();
      for(const v of pred[w]) delta[v]+=sigma[v]/sigma[w]*(1+delta[w]);
      if(w!==s) cb[w]+=delta[w];
    }
  }
  const norm=(N-1)*(N-2)/2;
  return cb.map(v=>v/norm);
}
const betweenness = computeBetweenness();
const maxBtw = Math.max(...betweenness);

// 3. Closeness (BFS)
function computeCloseness(){
  return nodeIds.map((_,s)=>{
    const dist=new Array(N).fill(-1); dist[s]=0;
    const queue=[s]; let total=0, reached=0;
    while(queue.length){
      const v=queue.shift();
      for(const {j:w} of adjList[v]){
        if(dist[w]<0){dist[w]=dist[v]+1;total+=dist[w];reached++;queue.push(w);}
      }
    }
    return total>0?(reached*(reached/(N-1)))/total:0;
  });
}
const closeness = computeCloseness();
const maxClose = Math.max(...closeness);

// 4. PageRank
function computePageRank(d=0.85,iter=20){
  let pr=new Array(N).fill(1/N);
  const outDeg=nodeIds.map((_,i)=>adjList[i].length);
  for(let it=0;it<iter;it++){
    const next=new Array(N).fill((1-d)/N);
    for(let v=0;v<N;v++){
      for(const {j:u} of adjList[v]) next[u]+=d*pr[v]/(outDeg[v]||1);
    }
    pr=next;
  }
  return pr;
}
const pagerank = computePageRank();
const maxPR = Math.max(...pagerank);

// 5. Clustering Coefficient
function computeClustering(){
  return nodeIds.map((_,i)=>{
    const nbrs=adjList[i].map(e=>e.j);
    const k=nbrs.length;
    if(k<2) return 0;
    let tri=0;
    for(let a=0;a<k;a++) for(let b=a+1;b<k;b++) if(adjU[nbrs[a]][nbrs[b]]) tri++;
    return 2*tri/(k*(k-1));
  });
}
const clustering = computeClustering();

// Community colours
const COMM_COLORS = {0:'#c0392b',1:'#2980b9',2:'#27ae60',3:'#f39c12'};
const COMM_NAMES  = {
  0:'Świat Julesa i Vincenta',
  1:'Świat Marsellusa i Mii',
  2:'Świat Butcha',
  3:'Diner — napad'
};

// Attach metrics to nodes
const nodes = RAW_NODES.map((n,i)=>({
  ...n,
  wDeg: wDeg[i], btw: betweenness[i], cls: closeness[i],
  pr: pagerank[i], clust: clustering[i]
}));

// Edges with weight
const edgeKey=(a,b)=>a<b?`${a}|${b}`:`${b}|${a}`;
const edgeMap={};
RAW_EDGES.forEach(e=>{
  const a=idx[e.s],b=idx[e.t];
  if(a===undefined||b===undefined)return;
  const k=edgeKey(a,b);
  edgeMap[k]=(edgeMap[k]||0)+e.w;
});
const links=Object.entries(edgeMap).map(([k,w])=>{
  const [a,b]=k.split('|').map(Number);
  return {source:a,target:b,weight:w};
});
const maxW=Math.max(...links.map(l=>l.weight));

// Network density
const density=2*links.length/(N*(N-1));

// ═══════════════════════════════════════════════════════════
// D3 VISUALIZATION
// ═══════════════════════════════════════════════════════════
const svg=d3.select('#graph-svg');
let width=svg.node().clientWidth||900, height=svg.node().clientHeight||600;

const defs=svg.append('defs');
// blood gradient for selected nodes
const rg=defs.append('radialGradient').attr('id','glow-grad');
rg.append('stop').attr('offset','0%').attr('stop-color','#f39c12').attr('stop-opacity',.4);
rg.append('stop').attr('offset','100%').attr('stop-color','#f39c12').attr('stop-opacity',0);

const g=svg.append('g');
let currentMode='degree';
let activeFilter=-1; // community filter
let selectedNode=null;

function nodeRadius(d,mode){
  const base=6, scale=22;
  switch(mode){
    case 'degree':      return base+scale*(d.wDeg/maxWDeg);
    case 'betweenness': return base+scale*(d.btw/(maxBtw||1));
    case 'closeness':   return base+scale*(d.cls/(maxClose||1));
    case 'pagerank':    return base+scale*(d.pr/(maxPR||1));
    case 'communities': return base+10; // Stały, czytelny promień w widoku ugrupowań
    default:            return base+12;
  }
}

// Force simulation
const sim=d3.forceSimulation(nodes)
  .force('link',d3.forceLink(links).id((_,i)=>i)
    .distance(l=>Math.max(50,140-l.weight*4))
    .strength(l=>0.3+l.weight/maxW*0.5))
  .force('charge',d3.forceManyBody().strength(-320))
  .force('center',d3.forceCenter(width/2,height/2))
  .force('collision',d3.forceCollide().radius(d=>nodeRadius(d,currentMode)+6));

// Draw links
const linkSel=g.append('g').attr('class','links')
  .selectAll('line').data(links).join('line')
  .attr('stroke','#444')
  .attr('stroke-width',l=>0.5+3.5*(l.weight/maxW))
  .attr('stroke-opacity',l=>0.15+0.5*(l.weight/maxW));

// Draw nodes
const nodeSel=g.append('g').attr('class','nodes')
  .selectAll('g').data(nodes).join('g')
  .attr('class','node-g')
  .call(d3.drag()
    .on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
    .on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
    .on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

nodeSel.append('circle')
  .attr('r',d=>nodeRadius(d,currentMode))
  .attr('fill',d=>COMM_COLORS[d.comm])
  .attr('stroke','rgba(0,0,0,.5)')
  .attr('stroke-width',1.5);

nodeSel.append('text')
  .attr('dy','0.35em')
  .attr('text-anchor','middle')
  .style('font-family','var(--font-display)')
  .style('font-size','9px')
  .style('fill','rgba(255,255,255,.85)')
  .style('pointer-events','none')
  .style('letter-spacing','1px')
  .text(d=>d.id.length>12?d.id.split(' ')[0]:d.id);

// Tooltip
const tooltip=document.getElementById('tooltip');

nodeSel
  .on('mousemove',(ev,d)=>{
    tooltip.style.display='block';
    tooltip.style.left=(ev.clientX+14)+'px';
    tooltip.style.top=(ev.clientY-10)+'px';
    tooltip.innerHTML=`
      <div class="t-name">${d.id}</div>
      <div class="t-row">Stopień: <span>${d.wDeg}</span></div>
      <div class="t-row">Pośrednictwo: <span>${(d.btw*100).toFixed(2)}%</span></div>
      <div class="t-row">PageRank: <span>${(d.pr*100).toFixed(2)}%</span></div>`;
  })
  .on('mouseleave',()=>{tooltip.style.display='none';})
  .on('click',(ev,d)=>{ev.stopPropagation();selectNode(d);});

svg.on('click',()=>clearSelection());

sim.on('tick',()=>{
  linkSel
    .attr('x1',l=>l.source.x).attr('y1',l=>l.source.y)
    .attr('x2',l=>l.target.x).attr('y2',l=>l.target.y);
  nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
});

// Zoom
svg.call(d3.zoom().scaleExtent([.1,6]).on('zoom',ev=>g.attr('transform',ev.transform)));

// Auto-fit after warmup
setTimeout(()=>{
  sim.alpha(.01);
  const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const pad=60, cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const scaleX=(width-pad*2)/(maxX-minX||1), scaleY=(height-pad*2)/(maxY-minY||1);
  const sc=Math.min(scaleX,scaleY,.9);
  svg.transition().duration(1200).call(
    d3.zoom().scaleExtent([.1,6]).on('zoom',ev=>g.attr('transform',ev.transform))
      .transform, d3.zoomIdentity.translate(width/2,height/2).scale(sc).translate(-cx,-cy));
},2500);

// ─── Mode buttons ───
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const mode=btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentMode=mode==='reset'?'degree':mode;
    if(mode==='reset') clearSelection();
    updateNodeSizesAndForces();
  });
});

// Zmodyfikowana funkcja aktualizująca rozmiary węzłów ORAZ siły przyciągania dla communities
function updateNodeSizesAndForces(){
  // Animacja zmiany promieni kół
  nodeSel.select('circle')
    .transition().duration(500)
    .attr('r',d=>nodeRadius(d,currentMode));

  // Punkty skupienia dla poszczególnych społeczności (cztery ćwiartki ekranu)
  const commCenters = {
    0: { x: width * 0.30, y: height * 0.30 }, // Jules / Vincent
    1: { x: width * 0.70, y: height * 0.30 }, // Marsellus / Mia
    2: { x: width * 0.30, y: height * 0.70 }, // Butch
    3: { x: width * 0.70, y: height * 0.70 }  // Diner
  };

  if(currentMode === 'communities') {
    // Odpięcie centralnego punktu skupienia, włączenie sił pozycjonujących X i Y dla grup
    sim.force('center', null)
       .force('charge', d3.forceManyBody().strength(-140))
       .force('x', d3.forceX(d => commCenters[d.comm].x).strength(0.18))
       .force('y', d3.forceY(d => commCenters[d.comm].y).strength(0.18));
  } else {
    // Przywrócenie standardowej fizyki centrowania
    sim.force('x', null)
       .force('y', null)
       .force('center', d3.forceCenter(width/2, height/2))
       .force('charge', d3.forceManyBody().strength(-320));
  }

  // Odświeżenie kolizji i restart symulacji z lekkim bodźcem (alpha)
  sim.force('collision', d3.forceCollide().radius(d=>nodeRadius(d,currentMode)+5))
     .alpha(0.3).restart();
}

// ─── Selection ───
function selectNode(d){
  selectedNode=d;
  // highlight
  const neighbours=new Set([d.id]);
  links.forEach(l=>{
    const sId=nodeIds[l.source.index??l.source];
    const tId=nodeIds[l.target.index??l.target];
    if(sId===d.id) neighbours.add(tId);
    if(tId===d.id) neighbours.add(sId);
  });
  nodeSel.select('circle')
    .attr('opacity',n=>neighbours.has(n.id)?1:.05)
    .attr('stroke',n=>n.id===d.id?'#f39c12':'rgba(0,0,0,.5)')
    .attr('stroke-width',n=>n.id===d.id?2.5:1.5);
  nodeSel.select('text').attr('opacity',n=>neighbours.has(n.id)?1:.05);
  linkSel.attr('opacity',l=>{
    const sId=nodeIds[l.source.index??l.source];
    const tId=nodeIds[l.target.index??l.target];
    return (sId===d.id||tId===d.id)?.7:.03;
  });
  renderNodeCard(d);
}

function clearSelection(){
  selectedNode=null;
  nodeSel.select('circle').attr('opacity',1).attr('stroke','rgba(0,0,0,.5)').attr('stroke-width',1.5);
  nodeSel.select('text').attr('opacity',1);
  linkSel.attr('opacity',l=>0.15+0.5*(l.weight/maxW));
  const card=document.getElementById('node-card');
  card.innerHTML=`<div class="section-title">POSTAĆ</div><div class="placeholder">Kliknij węzeł w grafie,<br>aby zobaczyć szczegóły.</div>`;
}

function renderNodeCard(d){
  const allLinks=links.filter(l=>{
    const s=nodeIds[l.source.index??l.source], t=nodeIds[l.target.index??l.target];
    return s===d.id||t===d.id;
  }).map(l=>{
    const s=nodeIds[l.source.index??l.source], t=nodeIds[l.target.index??l.target];
    const other=s===d.id?t:s;
    return {name:other,weight:l.weight,comm:nodes[idx[other]].comm};
  }).sort((a,b)=>b.weight-a.weight).slice(0,5);

  const fmt2=v=>(v*100).toFixed(2)+'%';
  const bar=(val,max,color)=>`<div class="metric-bar-wrap"><div class="metric-bar" style="width:${(val/max*100).toFixed(1)}%;background:${color}"></div></div>`;
  document.getElementById('node-card').innerHTML=`
    <div class="node-name">${d.id}</div>
    <div class="comm-tag" style="background:${COMM_COLORS[d.comm]}22;border:1px solid ${COMM_COLORS[d.comm]};color:${COMM_COLORS[d.comm]}">${COMM_NAMES[d.comm]}</div>
    <div class="metric-row"><span class="metric-label">Stopień</span>${bar(d.wDeg,maxWDeg,'#c0392b')}<span class="metric-val">${d.wDeg}</span></div>
    <div class="metric-row"><span class="metric-label">Pośrednictwo</span>${bar(d.btw,maxBtw||1,'#f39c12')}<span class="metric-val">${fmt2(d.btw)}</span></div>
    <div class="metric-row"><span class="metric-label">Bliskość</span>${bar(d.cls,maxClose||1,'#2980b9')}<span class="metric-val">${d.cls.toFixed(3)}</span></div>
    <div class="metric-row"><span class="metric-label">PageRank</span>${bar(d.pr,maxPR,'#27ae60')}<span class="metric-val">${fmt2(d.pr)}</span></div>
    <div class="metric-row"><span class="metric-label">Klasteryz.</span>${bar(d.clust,1,'#8e44ad')}<span class="metric-val">${d.clust.toFixed(3)}</span></div>
    <div class="links-title">NAJSILNIEJSZE POWIĄZANIA</div>
    ${allLinks.map(l=>`<div class="link-row"><div class="link-dot" style="background:${COMM_COLORS[l.comm]}"></div><span class="link-name">${l.name}</span><span class="link-weight">×${l.weight}</span></div>`).join('')}`;
}

// ─── Legend ───
const legendList=document.getElementById('legend-list');
Object.entries(COMM_NAMES).forEach(([commId,name])=>{
  const count=nodes.filter(n=>n.comm==commId).length;
  const item=document.createElement('div');
  item.className='comm-item';
  item.innerHTML=`<div class="comm-dot" style="background:${COMM_COLORS[commId]}"></div><span class="comm-label">${name}</span><span class="comm-count">${count}</span>`;
  item.addEventListener('click',()=>{
    if(activeFilter==commId){
      activeFilter=-1;
      item.classList.remove('active-filter');
      document.querySelectorAll('.comm-item').forEach(i=>i.classList.remove('active-filter'));
      nodeSel.select('circle').attr('opacity',1);
      nodeSel.select('text').attr('opacity',1);
      linkSel.attr('opacity',l=>0.15+0.5*(l.weight/maxW));
      renderRanking(currentRankMode, -1);
    } else {
      activeFilter=Number(commId);
      document.querySelectorAll('.comm-item').forEach(i=>i.classList.remove('active-filter'));
      item.classList.add('active-filter');
      nodeSel.select('circle').attr('opacity',n=>n.comm==commId?1:.06);
      nodeSel.select('text').attr('opacity',n=>n.comm==commId?1:.06);
      linkSel.attr('opacity',l=>{
        const s=nodes[l.source.index??l.source], t=nodes[l.target.index??l.target];
        return (s.comm==commId&&t.comm==commId)?.6:.02;
      });
      renderRanking(currentRankMode,Number(commId));
    }
  });
  legendList.appendChild(item);
});

// ─── Ranking ───
let currentRankMode='degree';
function renderRanking(mode,commFilter=-1){
  currentRankMode=mode;
  let sorted=[...nodes];
  if(commFilter>=0) sorted=sorted.filter(n=>n.comm==commFilter);
  const key={degree:'wDeg',betweenness:'btw',closeness:'cls',pagerank:'pr'}[mode];
  const maxV=Math.max(...sorted.map(n=>n[key]));
  sorted.sort((a,b)=>b[key]-a[key]);
  const top=sorted.slice(0,15);
  const color=COMM_COLORS;
  document.getElementById('rank-list').innerHTML=top.map((n,i)=>{
    const pct=(n[key]/(maxV||1)*100).toFixed(1);
    const val=mode==='degree'?n.wDeg:mode==='closeness'?n.cls.toFixed(3):(n[key]*100).toFixed(2)+'%';
    return `<div class="rank-row" data-id="${n.id}">
      <span class="rank-num">${i+1}</span>
      <div class="link-dot" style="background:${color[n.comm]}"></div>
      <span class="rank-name">${n.id}</span>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%;background:${color[n.comm]}"></div></div>
      <span class="rank-val">${val}</span>
    </div>`;
  }).join('');
  
  document.getElementById('rank-list').querySelectorAll('.rank-row').forEach(row=>{
    row.addEventListener('click',()=>{
      const n=nodes.find(x=>x.id===row.dataset.id);
      if(n) selectNode(n);
    });
  });
}

// Ukończenie urwanego kodu dla zakładek rankingu
document.querySelectorAll('.rank-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.rank-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    renderRanking(tab.dataset.rank, activeFilter);
  });
});

// ─── Dynamiczne wypełnienie sekcji interpretacji ───
const interpGrid = document.getElementById('interp-grid');
interpGrid.innerHTML = `
  <div class="interp-block">
    <h3>Struktura Modułowa i cztery akty</h3>
    <p>Algorytm detekcji społeczności idealnie wyodrębnia autonomiczne wątki scenariuszowe dzieła Tarantino. Każdy kolor odpowiada innej mikro-narracji: od gangsterskiego epizodu z walizką, przez wieczór z Mią, po ucieczkę Butcha i finałowy napad w restauracji typu diner.</p>
  </div>
  <div class="interp-block">
    <h3>Vincent Vega jako most sieciowy</h3>
    <p>Z punktu widzenia miar centralności pośrednictwa (<em>Betweenness Centrality</em>), postać grająca kluczową rolę w spajaniu kompozycji to Vincent. Łączy on odrębne klastery (społeczności), co tłumaczy strukturę narracji, w której bohater przechodzi płynnie przez historie innych postaci.</p>
  </div>
`;

// Wywołanie początkowe rankingu
renderRanking('degree');

</script>
</body>
